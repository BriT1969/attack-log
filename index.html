<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<title>Attack Log</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single column, action-first. One dominant control at the top,
   quick actions beneath it, the day's timeline below that.
   Dark-only and blue-free on purpose: this gets used at 2am mid-attack,
   and blue-white is the wavelength that provokes photophobia hardest. */
:root{
  --bg:#14110e;
  --surface:#1d1915;
  --surface-2:#272019;
  --line:#3a3027;
  --line-soft:#2c251e;
  --fg:#ece2d4;
  --fg-dim:#a3948211;
  --dim:#a39482;
  --dim-2:#7d7064;
  --amber:#e0a04a;
  --amber-ink:#2a1d0a;
  --ember:#d2664a;
  --ember-dim:#4a2318;
  --sage:#8aa368;
  --font:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-block:18px 14px;border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.brand{font-weight:600;font-size:18px;letter-spacing:.01em}
.brand span{color:var(--dim-2);font-weight:400}
.sync{font-family:var(--mono);font-size:11px;color:var(--dim-2);display:flex;align-items:center;
  gap:6px;min-width:0;text-align:right;line-height:1.3}
.sync span:last-child{overflow-wrap:anywhere}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim-2);flex:none}
.dot.ok{background:var(--sage)}
.dot.wait{background:var(--amber)}

/* the main control */
.hero{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:14px}
.hero.live{border-color:var(--ember);background:linear-gradient(180deg,var(--ember-dim),var(--surface) 70%)}
.hero-body{padding:20px 18px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim-2);margin-bottom:10px}
.hero.live .eyebrow{color:var(--ember)}
.hero-head{font-size:24px;font-weight:600;line-height:1.2;text-wrap:balance;margin:0 0 4px}
.elapsed{font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.05;margin:2px 0 2px}
.hero-sub{color:var(--dim);font-size:14px}

button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
.big{display:block;width:100%;padding:17px 16px;border:none;border-radius:11px;
  font-size:17px;font-weight:600;letter-spacing:.01em;text-align:center;
  background:var(--amber);color:var(--amber-ink);margin-top:16px;
  transition:filter .12s}
.big:active{filter:brightness(.88)}
.big.stop{background:var(--ember);color:#1a0d08}
.big:focus-visible,.q:focus-visible,.chip:focus-visible,.lnk:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.q{padding:13px 8px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  font-size:13px;font-weight:500;text-align:center;line-height:1.25;color:var(--fg)}
.q:active{background:var(--surface-2)}
.q small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim-2);margin-top:3px}

h2{font-size:12px;font-family:var(--mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim-2);font-weight:500;margin:0 0 10px}
section{margin-bottom:26px}

/* timeline */
.feed{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:11px;overflow:hidden}
.ev{display:flex;gap:12px;padding:11px 13px;background:var(--surface);align-items:flex-start}
.ev time{font-family:var(--mono);font-size:12px;color:var(--dim-2);flex:none;width:40px;
  font-variant-numeric:tabular-nums;padding-top:2px}
.ev-main{min-width:0;flex:1}
.ev-t{font-size:14px;font-weight:500}
.ev-d{font-size:13px;color:var(--dim);margin-top:1px;overflow-wrap:break-word}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--dim);flex:none}
.tag.att{background:var(--ember-dim);color:var(--ember)}
.tag.sig{background:#3a2c12;color:var(--amber)}
.tag.med{background:#2b2a1c;color:var(--sage)}

.empty{border:1px dashed var(--line);border-radius:11px;padding:22px 16px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--fg);font-weight:500;margin-bottom:3px;font-size:15px}
.empty span{font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border:1px solid var(--line-soft);border-radius:10px;padding:11px 12px;background:var(--surface)}
.stat .n{font-family:var(--mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.3}
.stat{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;position:relative}
button.stat::after{content:"›";position:absolute;right:12px;top:10px;color:var(--dim-2);font-size:18px;line-height:1}
button.stat:active{background:var(--line-soft)}
.stat.warn{border-color:var(--amber)}
.stat.warn .n{color:var(--amber)}

/* review */
.card{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:14px;margin-bottom:8px}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
.card-h b{font-weight:600;font-size:15px}
.card-h em{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--dim-2)}
.lnk{font-size:14px;font-weight:500;color:var(--amber);text-decoration:underline;
  text-underline-offset:3px;padding:2px 0}
.verdict{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;background:var(--surface-2);color:var(--dim)}
.verdict.mig{background:var(--ember-dim);color:var(--ember)}
.verdict.ten{background:#2a2a20;color:var(--sage)}

/* sheet / overlay */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
.sheet-h h3{font-size:21px;font-weight:600;margin:0}
.sheet-note{color:var(--dim);font-size:14px;margin:0 0 20px}
.field{margin-bottom:18px}
.field > label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim-2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  font-size:14px;color:var(--fg);line-height:1.2}
.chip[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:500}
input[type=text],input[type=number],input[type=datetime-local],textarea,select{
  width:100%;padding:11px 12px;background:var(--surface);color:var(--fg);
  border:1px solid var(--line);border-radius:9px;font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:-1px;border-color:var(--amber)}
textarea{min-height:76px;resize:vertical}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.actions{display:flex;gap:9px;margin-top:24px;flex-wrap:wrap}
.actions .big{margin-top:0;flex:1 1 180px}
.ghost{background:none;border:1px solid var(--line);color:var(--fg)}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:10px 18px;font-size:14px;display:flex;gap:14px;align-items:center;
  box-shadow:0 6px 26px rgba(0,0,0,.6);max-width:calc(100vw - 32px)}
.toast button{color:var(--amber);font-weight:600;font-size:14px;white-space:nowrap}

.foot{border-top:1px solid var(--line-soft);padding-top:16px;display:flex;
  gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim-2)}
/* chart: slots 2 and 3 of the validated categorical set, stepped for this
   dark surface — orange for systolic, aqua for diastolic */
:root{--sys:#d95926;--dia:#199e70;--grid:#2e2721;--ref:#5c4f44}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{font-family:var(--mono);fill:var(--dim-2)}
.readout{font-family:var(--mono);font-size:12px;color:var(--dim);min-height:18px;
  margin:2px 0 6px;font-variant-numeric:tabular-nums}
.key{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--dim);margin-top:8px}
.key i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ctitle{font-size:13px;font-weight:500;color:var(--fg);margin:18px 0 2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* dose timers */
.clock{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:.02em;margin:2px 0 14px}
.clock small{font-size:12px;color:var(--dim-2);margin-left:8px;letter-spacing:0}
.dl{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.dl-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line-soft)}
.dl-row:first-child{border-top:0}
.dl-n{font-weight:600}
.dl-s{font-family:var(--mono);font-size:12px;color:var(--dim)}
.dl-t{font-family:var(--mono);font-size:16px;text-align:right;white-space:nowrap}
.dl-t small{display:block;font-size:11px;color:var(--dim-2)}
.dl-t.wait{color:var(--amber)}
.dl-t.ok{color:var(--sage)}
.dl-empty{padding:12px 14px;font-size:14px;color:var(--dim-2)}
/* patterns */
.hist{display:flex;gap:2px;margin:6px 0 4px}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.hb .bar{height:64px;width:100%;display:flex;align-items:flex-end}
.hb i{display:block;width:100%;background:var(--amber);border-radius:2px 2px 0 0}
.hb.alt i{background:var(--sage)}
.hb small{font-family:var(--mono);font-size:10px;color:var(--dim-2);height:13px;line-height:13px;white-space:nowrap}
.ptitle{font-size:12px;font-family:var(--mono);color:var(--dim-2);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 2px}
.pnote{font-size:13px;color:var(--dim);margin:0 0 6px}
/* dose outcome + comparison tables */
.oc{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.oc span{font-size:12px;color:var(--dim-2);margin-right:2px}
.ob{font:inherit;font-size:13px;min-height:32px;padding:4px 12px;border:1px solid var(--line);border-radius:16px;background:transparent;color:var(--dim);cursor:pointer}
.ob.on{border-color:var(--amber);color:var(--amber);background:var(--ember-dim)}
.cmp{display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;font-size:14px;margin-bottom:6px}
.cmp>div{padding:9px 12px;border-top:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.cmp>.h{border-top:0;font-family:var(--mono);font-size:11px;color:var(--dim-2);text-transform:uppercase;letter-spacing:.06em}
.cmp>.r{color:var(--dim);overflow-wrap:anywhere;min-width:0}
.cmp.tight>div{padding:9px 6px}
.cmp.tight>div:first-child,.cmp.tight>.r{padding-left:12px}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand">Attack Log <span>· Lee</span></div>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">starting up</span></div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-body">
      <div class="eyebrow" id="heroEyebrow">Status</div>
      <div id="heroMain"><p class="hero-head">Loading your log…</p></div>
      <button class="big" id="mainBtn" hidden></button>
    </div>
  </div>

  <div class="quick">
    <button class="q" id="btnSignal">Warning signs<small>premonitory</small></button>
    <button class="q" id="btnMed">Took something<small>dose</small></button>
    <button class="q" id="btnBp">Blood pressure<small>reading</small></button>
  </div>

  <section id="reviewWrap" hidden>
    <h2>Needs scoring</h2>
    <div id="reviewList"></div>
  </section>

  <section>
    <h2 id="feedHead">Today</h2>
    <div id="feed"></div>
  </section>

  <section>
    <h2>Last 30 days</h2>
    <div class="stats" id="stats"></div>
  </section>

  <div class="foot">
    <button class="lnk" id="btnHistory">All attacks</button>
    <button class="lnk" id="btnPatterns">Patterns</button>
    <button class="lnk" id="btnChart">BP chart</button>
    <button class="lnk" id="btnExport">Export</button>
    <button class="lnk" id="btnSetup">Settings</button>
    <span id="outboxNote" style="margin-left:auto"></span>
  </div>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden><span id="toastTxt"></span><button id="toastBtn" hidden>Undo</button></div>

<script>
"use strict";
const MEDS=["Paracetamol","Paracetamol+Caffeine+Aspirin","Ibuprofen","Naproxen","Naratriptan","Sumatriptan","Sudafed","Lemsip","Other"];
const CLASS={Naratriptan:"triptan",Sumatriptan:"triptan","Paracetamol+Caffeine+Aspirin":"combo",Lemsip:"combo",Paracetamol:"simple",Ibuprofen:"simple",Naproxen:"simple"};
const SIGNS=["Yawning","Unusual tiredness","Neck / shoulder","Food craving","Mood change","Passing water often","Light sensitivity","Other"];
const SIDES=["Right","Left","Both","Back of head"];
const SYMPTOMS=[["throbbing","Throbbing"],["oneSided","One-sided"],["nausea","Nausea or sickness"],["lightSound","Light or sound hurt"],["stopped","Stopped what I was doing"],["worseMove","Worse on movement"]];
const AUTO=[["eye","Watery or red eye"],["nose","Blocked or running nose"],["lid","Drooping or puffy lid"]];
const KEY="attacklog.v1";
const CFG="attacklog.cfg";
const COLLS=["attacks","signals","doses","readings"];

let S={attacks:{},signals:{},doses:{},readings:{}};
let outbox=[],undoFn=null,tick=null;

/* ---------- storage: local truth, posted to your Google Sheet ---------- */
function cfg(){try{return JSON.parse(localStorage.getItem(CFG)||"{}")}catch(e){return{}}}
function setCfg(o){try{localStorage.setItem(CFG,JSON.stringify(o))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);
  COLLS.forEach(c=>{if(p[c])S[c]=p[c]});if(Array.isArray(p._outbox))outbox=p._outbox}}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(Object.assign({},S,{_outbox:outbox})))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function live(coll){return Object.values(S[coll]).filter(r=>!r.deleted)}

function put(coll,rec){rec.rev=Date.now();S[coll][rec.id]=rec;saveLocal();render();return rec}
function drop(coll,id){const r=S[coll][id];if(!r)return;r.deleted=true;r.rev=Date.now();
  outbox=outbox.filter(e=>e.localRef!==id);saveLocal();render();}

/* every posted row is one event; the outbox holds what has not reached the Sheet */
function emit(ev,localRef){
  ev.eventId=uid();ev.localRef=localRef||null;
  outbox.push(ev);saveLocal();render();send();
}
async function send(){
  const c=cfg();
  if(!c.url){setSync("","not connected — open Settings");paintOutbox();return}
  if(!outbox.length){setSync("ok","in your Sheet");paintOutbox();return}
  if(send._busy)return; send._busy=true;
  setSync("wait","sending "+outbox.length);
  const batch=outbox.slice(0,25);
  try{
    // plain-text body keeps this a simple request, so no CORS preflight
    const res=await fetch(c.url,{method:"POST",body:JSON.stringify({token:c.token||"",events:batch})});
    const out=await res.json();
    if(out&&out.ok){
      const done=new Set(out.ids||batch.map(e=>e.eventId));
      outbox=outbox.filter(e=>!done.has(e.eventId));
      saveLocal();
      setSync(outbox.length?"wait":"ok",outbox.length?outbox.length+" waiting":"in your Sheet");
    }else{
      setSync("",(out&&out.error)||"the Sheet refused it");
    }
  }catch(err){
    setSync("",navigator.onLine?"cannot reach the Sheet":"offline — "+outbox.length+" waiting");
  }
  send._busy=false;paintOutbox();
}
/* rebuild local state from the Sheet, so any device shows the same history */
const C={ts:0,event:3,attackId:4,started:5,ended:6,type:7,side:8,aura:9,
  throbbing:10,oneSided:11,nausea:12,lightSound:13,stopped:14,worseMove:15,
  eye:16,nose:17,autoSide:18,signs:19,drug:20,cls:21,sys:22,dia:23,pulse:24,dizzy:25,note:26};
const Y=v=>String(v||"").trim()==="Y";
const T=v=>v?Date.parse(v):null;
function rebuild(rows){
  const N={attacks:{},signals:{},doses:{},readings:{}};
  const outs=[];
  rows.forEach((r,i)=>{
    const at=T(r[C.ts]); if(!at)return;
    const ev=String(r[C.event]||"");
    if(ev==="attack start"){
      const id=String(r[C.attackId]||"as"+i);
      N.attacks[id]=Object.assign({id:id,startedAt:at,endedAt:null,scored:false},N.attacks[id]||{});
      N.attacks[id].startedAt=at;
    }else if(ev.indexOf("attack end")===0||ev.indexOf("attack ended")===0){
      const id=String(r[C.attackId]||"ae"+i);
      const a=N.attacks[id]||(N.attacks[id]={id:id,startedAt:T(r[C.started])||at});
      a.startedAt=T(r[C.started])||a.startedAt;
      a.endedAt=T(r[C.ended])||at;
      if(ev==="attack end"){
        a.type=r[C.type]||"";a.side=String(r[C.side]||"").split(" / ").filter(Boolean);
        a.aura=Y(r[C.aura]);
        a.symptoms={throbbing:Y(r[C.throbbing]),oneSided:Y(r[C.oneSided]),nausea:Y(r[C.nausea]),
          lightSound:Y(r[C.lightSound]),stopped:Y(r[C.stopped]),worseMove:Y(r[C.worseMove])};
        a.autonomic={eye:Y(r[C.eye]),nose:Y(r[C.nose])};
        a.autonomicSide=r[C.autoSide]||"";a.note=r[C.note]||"";a.scored=true;
      }
    }else if(ev==="signal"){
      N.signals["s"+i]={id:"s"+i,at:at,kinds:String(r[C.signs]||"").split(" / ").filter(Boolean),note:r[C.note]||""};
    }else if(ev==="dose"){
      N.doses["d"+i]={id:"d"+i,at:at,drug:r[C.drug]||"",attackId:r[C.attackId]||null};
    }else if(ev==="dose outcome"){
      outs.push({started:T(r[C.started]),drug:r[C.drug]||"",v:String(r[C.note]||"")});
    }else if(ev==="reading"){
      N.readings["r"+i]={id:"r"+i,at:at,sys:+r[C.sys]||0,dia:+r[C.dia]||0,
        pulse:+r[C.pulse]||null,orthostatic:Y(r[C.dizzy]),note:r[C.note]||""};
    }
  });
  // keep anything still waiting to be sent
  const keep=new Set(outbox.map(e=>e.localRef).filter(Boolean));
  COLLS.forEach(c=>{Object.keys(S[c]).forEach(id=>{if(keep.has(id))N[c][id]=S[c][id]})});
  // a dose outcome is its own row pointing at the dose by drug and time; the latest wins.
  // Ones still waiting in the outbox count too, so a rating never flickers back.
  const applyOut=o=>{const d=Object.values(N.doses).find(x=>x.drug===o.drug&&o.started&&Math.abs(x.at-o.started)<2000);if(d)d.helped=o.v};
  outs.forEach(applyOut);
  outbox.filter(e=>e.event==="dose outcome").forEach(e=>applyOut({started:e.started,drug:e.drug,v:e.note}));
  S=N;saveLocal();
}
async function pullAll(){
  const c=cfg(); if(!c.url)return null;
  try{
    const res=await fetch(c.url,{method:"POST",body:JSON.stringify({token:c.token||"",action:"read"})});
    const out=await res.json();
    if(!out||!out.ok)return (out&&out.error)||"refused";
    rebuild(out.rows||[]);render();
    return null;
  }catch(e){return "cannot reach the Sheet"}
}

/* ---------- derived ---------- */
const DAY=864e5;
function dayKey(ms){const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hhmm(ms){const d=new Date(ms);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function dmy(ms){const d=new Date(ms);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function openAttack(){return live("attacks").find(a=>!a.endedAt)||null}
function hours(a){return a.endedAt?(a.endedAt-a.startedAt)/36e5:null}

function score(a){
  if(!a.scored)return{id:null,pound:null,verdict:"not scored"};
  const s=a.symptoms||{},h=hours(a);
  const idm=(s.nausea?1:0)+(s.lightSound?1:0)+(s.stopped?1:0);
  const pnd=(s.throbbing?1:0)+(h>=4&&h<=72?1:0)+(s.oneSided?1:0)+(s.nausea?1:0)+(s.stopped?1:0);
  let v="Unclear";
  if(a.aura)v="Migraine likely";
  else if(idm>=2||pnd>=4)v="Migraine likely";
  else if(idm===0&&pnd<=1&&!s.worseMove)v="Tension-type likely";
  return{id:idm,pound:pnd,verdict:v};
}
function windows(){
  const now=Date.now(),from=now-30*DAY,set={triptan:new Set(),combo:new Set(),simple:new Set(),any:new Set()};
  live("doses").filter(d=>d.at>=from).forEach(d=>{
    const k=dayKey(d.at);set.any.add(k);
    const c=CLASS[d.drug];if(c)set[c].add(k);
  });
  const attackDays=new Set(live("attacks").filter(a=>a.startedAt>=from).map(a=>dayKey(a.startedAt)));
  const sigs=live("signals").filter(s=>s.at>=from);
  let hit=0;
  sigs.forEach(s=>{if(live("attacks").some(a=>a.startedAt>s.at&&a.startedAt-s.at<=DAY))hit++});
  return{triptan:set.triptan.size,combo:set.combo.size,simple:set.simple.size,any:set.any.size,
    attackDays:attackDays.size,signals:sigs.length,hit:hit};
}

/* ---------- render ---------- */
function render(){
  const a=openAttack();
  const hero=document.getElementById("hero"),main=document.getElementById("heroMain"),
        btn=document.getElementById("mainBtn"),eye=document.getElementById("heroEyebrow");
  btn.hidden=false;
  if(a){
    hero.classList.add("live");eye.textContent="Attack running";
    const mins=Math.round((Date.now()-a.startedAt)/6e4);
    main.innerHTML='<div class="elapsed">'+Math.floor(mins/60)+"h "+String(mins%60).padStart(2,"0")+'m</div>'+
      '<div class="hero-sub">Started '+hhmm(a.startedAt)+(dayKey(a.startedAt)!==dayKey(Date.now())?" on "+dmy(a.startedAt):"")+"</div>";
    btn.textContent="It's over";btn.className="big stop";btn.onclick=()=>closeSheet(a.id);
    if(!tick)tick=setInterval(()=>{if(openAttack())render()},30000);
  }else{
    hero.classList.remove("live");eye.textContent="Status";
    const last=live("attacks").filter(x=>x.endedAt).sort((x,y)=>y.endedAt-x.endedAt)[0];
    main.innerHTML='<p class="hero-head">No attack running</p><div class="hero-sub">'+
      (last?"Last one ended "+dmy(last.endedAt)+" at "+hhmm(last.endedAt):"Tap below the moment one starts. Everything else can wait.")+"</div>";
    btn.textContent="Attack starting";btn.className="big";btn.onclick=startAttack;
    if(tick){clearInterval(tick);tick=null}
  }
  renderFeed();renderReview();renderStats();
}

function renderFeed(){
  const today=dayKey(Date.now());
  let evs=[];
  live("attacks").forEach(a=>{
    evs.push({at:a.startedAt,tag:"att",t:"Attack started",d:a.note||""});
    if(a.endedAt)evs.push({at:a.endedAt,tag:"att",t:"Attack ended",d:(a.scored?score(a).verdict:"")+(hours(a)?(a.scored?" · ":"")+hours(a).toFixed(1)+"h":"")});
  });
  live("signals").forEach(s=>evs.push({at:s.at,tag:"sig",t:"Warning signs",d:(s.kinds||[]).join(", ")}));
  live("doses").forEach(d=>evs.push({at:d.at,tag:"med",t:d.drug,d:""}));
  live("readings").forEach(r=>evs.push({at:r.at,tag:"",t:r.sys+"/"+r.dia,d:"pulse "+r.pulse+(r.orthostatic?" · dizzy on standing":"")+(r.note?" · "+r.note:"")}));
  const mine=evs.filter(e=>dayKey(e.at)===today).sort((x,y)=>y.at-x.at);
  const f=document.getElementById("feed");
  if(!mine.length){
    f.outerHTML='<div class="empty" id="feed"><b>Nothing logged today</b><span>Attacks, warning signs, doses and BP readings all show up here.</span></div>';
    return;
  }
  f.outerHTML='<div class="feed" id="feed">'+mine.map(e=>
    '<div class="ev"><time>'+hhmm(e.at)+"</time>"+
    '<div class="ev-main"><div class="ev-t">'+esc(e.t)+"</div>"+
    (e.d?'<div class="ev-d">'+esc(e.d)+"</div>":"")+"</div>"+
    (e.tag?'<span class="tag '+e.tag+'">'+(e.tag==="att"?"attack":e.tag==="sig"?"signal":"med")+"</span>":"")+
    "</div>").join("")+"</div>";
}

function renderReview(){
  const un=live("attacks").filter(a=>a.endedAt&&!a.scored).sort((x,y)=>y.endedAt-x.endedAt);
  document.getElementById("reviewWrap").hidden=!un.length;
  document.getElementById("reviewList").innerHTML=un.map(a=>
    '<div class="card"><div class="card-h"><b>'+dmy(a.startedAt)+", "+hhmm(a.startedAt)+"</b>"+
    "<em>"+(hours(a)||0).toFixed(1)+"h</em></div>"+
    '<button class="lnk" data-score="'+a.id+'">Score it</button></div>').join("");

function renderStats(){
  const w=windows();
  const cell=(n,l,warn,k)=>'<button type="button" class="stat'+(warn?" warn":"")+'" data-k="'+k+'"><div class="n">'+n+'</div><div class="l">'+l+"</div></button>";
  document.getElementById("stats").innerHTML=
    cell(w.attackDays,"attack days",false,"attack")+
    cell(w.any,"days on any acute med",false,"any")+
    cell(w.triptan+" <span style='font-size:13px;color:var(--dim-2)'>/ 10</span>","triptan days",w.triptan>=10,"triptan")+
    cell(w.combo+" <span style='font-size:13px;color:var(--dim-2)'>/ 10</span>","combination analgesic days",w.combo>=10,"combo")+
    cell(w.simple+" <span style='font-size:13px;color:var(--dim-2)'>/ 15</span>","simple analgesic days",w.simple>=15,"simple")+

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- stat detail ---------- */
const LIM={triptan:10,combo:10,simple:15};
const MEDNAME={any:"Days on any acute med",triptan:"Triptan days",combo:"Combination analgesic days",simple:"Simple analgesic days"};
function detailSheet(k){
  const now=Date.now(),from=now-30*DAY;
  const row=(l,sub,r,rc)=>'<div class="dl-row"><div><div class="dl-n">'+l+'</div><div class="dl-s">'+sub+'</div></div>'+
    (r?'<div class="dl-t'+(rc?" "+rc:"")+'">'+r+"</div>":"")+"</div>";
  let title,note,rows="";
  if(k==="attack"){
    title="Attack days";
    const as=live("attacks").filter(a=>a.startedAt>=from).sort((x,y)=>y.startedAt-x.startedAt);
    const days=new Set(as.map(a=>dayKey(a.startedAt))).size;
    note=as.length+" attack"+(as.length===1?"":"s")+" on "+days+" day"+(days===1?"":"s")+" in the last 30 days.";
    rows=as.map(a=>{
      const h=hours(a);
      const sub=hhmm(a.startedAt)+(a.endedAt?" to "+hhmm(a.endedAt)+" · "+h.toFixed(1)+"h":" · still running");
      const x=attackExtras(a);
      const extra="<br>Meds: "+(x.doses.length?esc(x.doses.map(doseLabel).join(" · ")):"none logged")+
        "<br>BP: "+(x.bp.length?esc(x.bp.map(r=>hhmm(r.at)+" "+r.sys+"/"+r.dia+(r.pulse?" p"+r.pulse:"")).join(" · ")):"none logged");
      return row(dmy(a.startedAt),esc(sub+(a.note?" · "+a.note:""))+extra,a.scored?esc(score(a).verdict.replace(" likely","")):"not scored",a.scored?"":"wait");
    }).join("");
  }else if(k==="signals"){
    title="Warning signs";
    const ss=live("signals").filter(x=>x.at>=from).sort((x,y)=>y.at-x.at);
    const att=live("attacks");
    let hit=0;
    rows=ss.map(x=>{
      const a=att.filter(a=>a.startedAt>x.at&&a.startedAt-x.at<=DAY).sort((p,q)=>p.startedAt-q.startedAt)[0];
      if(a)hit++;
      return row(dmy(x.at)+" "+hhmm(x.at),esc((x.kinds||[]).join(", ")),
        a?"attack "+((a.startedAt-x.at)/36e5).toFixed(1)+"h later":"no attack within 24h",a?"wait":"");
    }).join("");
    note=ss.length?hit+" of "+ss.length+" followed by an attack within 24h.":"";
  }else{
    title=MEDNAME[k];
    const cls=k==="any"?null:k;
    const ds=live("doses").filter(d=>d.at>=from&&(!cls||CLASS[d.drug]===cls)).sort((x,y)=>y.at-x.at);
    const by={};ds.forEach(d=>(by[dayKey(d.at)]=by[dayKey(d.at)]||[]).push(d));
    const keys=Object.keys(by).sort().reverse();
    note=keys.length+" day"+(keys.length===1?"":"s")+" in the last 30"+(LIM[k]?" (limit "+LIM[k]+")":"")+".";
    if(keys.length){
      const oldest=by[keys[keys.length-1]];
      const drop=Math.max.apply(null,oldest.map(d=>d.at))+30*DAY;
      note+=" Oldest day drops out on "+dmy(drop)+".";
    }
    rows=keys.map(key=>{
      const g=by[key].slice().sort((x,y)=>x.at-y.at);
      return row(dmy(g[0].at),esc(g.map(doseLabel).join(" · ")),g.length+" dose"+(g.length===1?"":"s"));
    }).join("");
  }
  openSheet('<div class="sheet-h"><h3>'+esc(title)+'</h3><button class="lnk" id="x">Close</button></div>'+
    (note?'<p class="sheet-note">'+esc(note)+"</p>":"")+
    '<div class="dl">'+(rows||'<div class="dl-empty">Nothing in the last 30 days.</div>')+"</div>");
  document.getElementById("x").onclick=shut;
}
document.getElementById("stats").addEventListener("click",e=>{
  const b=e.target.closest(".stat");if(b)detailSheet(b.dataset.k);
});

/* ---------- patterns ---------- */
const BEDKEY="attacklog.bedtime";
function getBed(){try{return localStorage.getItem(BEDKEY)||""}catch(e){return""}}
function setBed(v){try{localStorage.setItem(BEDKEY,v)}catch(e){}}
function median(a){if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function hrs(ms){const d=new Date(ms);return d.getHours()+d.getMinutes()/60}
function clock(h){h=((h%24)+24)%24;let H=Math.floor(h),M=Math.round((h-H)*60);if(M===60){H=(H+1)%24;M=0}return String(H).padStart(2,"0")+":"+String(M).padStart(2,"0")}
function hist(counts,labels,alt){
  const mx=Math.max.apply(null,counts.concat([1]));
  return '<div class="hist">'+counts.map((c,i)=>'<div class="hb'+(alt?" alt":"")+'"><small>'+(c||"")+'</small><div class="bar"><i style="height:'+(c/mx*100)+'%"></i></div><small>'+(labels[i]||"")+"</small></div>").join("")+"</div>";
}
function clusterList(atks){
  const keys=[...new Set(atks.map(a=>dayKey(a.startedAt)))].sort();
  const dnum=k=>{const p=k.split("-");return Math.round(new Date(+p[0],+p[1]-1,+p[2]).getTime()/DAY)};
  const cl=[];
  keys.forEach(k=>{const n=dnum(k),last=cl[cl.length-1];
    if(last&&n-last.endN<=3){last.endN=n;last.endK=k;last.days++}else cl.push({startK:k,endK:k,startN:n,endN:n,days:1})});
  cl.forEach(c=>{c.attacks=atks.filter(a=>{const k=dayKey(a.startedAt);return k>=c.startK&&k<=c.endK}).length});
  return cl;
}
function nightDayHtml(all){
  const isNight=a=>{const h=new Date(a.startedAt).getHours();return h>=22||h<8};
  const G=[all.filter(isNight),all.filter(a=>!isNight(a))];
  const info=G.map(g=>{
    const sc=g.filter(a=>a.scored);
    const durs=g.filter(a=>a.endedAt&&a.endedAt>a.startedAt).map(a=>hours(a));
    const sym=k=>sc.filter(a=>(a.symptoms||{})[k]).length+"/"+sc.length;
    const ver=v=>sc.filter(a=>score(a).verdict===v).length+"/"+sc.length;
    return{
      n:String(g.length),
      len:durs.length?median(durs).toFixed(1)+"h":"-",
      throb:sym("throbbing"),one:sym("oneSided"),nau:sym("nausea"),ls:sym("lightSound"),stop:sym("stopped"),worse:sym("worseMove"),
      aura:sc.filter(a=>a.aura).length+"/"+sc.length,
      auto:sc.filter(a=>a.autonomic&&(a.autonomic.eye||a.autonomic.nose)).length+"/"+sc.length,
      mig:ver("Migraine likely"),ten:ver("Tension-type likely"),unc:ver("Unclear"),
      trip:g.filter(a=>attackExtras(a).doses.some(d=>CLASS[d.drug]==="triptan")).length+"/"+g.length
    };
  });
  const R=[["Attacks","n"],["Median length","len"],["Throbbing","throb"],["One-sided","one"],["Nausea","nau"],["Light or sound","ls"],
    ["Stopped activity","stop"],["Worse on movement","worse"],["Aura","aura"],["Eye or nose signs","auto"],
    ["Migraine likely","mig"],["Tension-type likely","ten"],["Unclear","unc"],["Took a triptan","trip"]];
  return '<div class="ptitle">Night vs daytime</div>'+
    '<p class="pnote">Night means it started between 22:00 and 08:00. Symptom rows count only attacks you have scored.</p>'+
    '<div class="cmp" style="grid-template-columns:1.4fr 1fr 1fr">'+
    '<div class="h"></div><div class="h">Night</div><div class="h">Day</div>'+
    R.map(r=>'<div class="r">'+r[0]+"</div><div>"+info[0][r[1]]+"</div><div>"+info[1][r[1]]+"</div>").join("")+"</div>";
}
function medsWorkedHtml(){
  const by={};
  live("doses").forEach(d=>{(by[d.drug]=by[d.drug]||{yes:0,partly:0,no:0,none:0,n:0});const o=by[d.drug];o.n++;o[d.helped||"none"]++});
  const names=Object.keys(by).sort((x,y)=>by[y].n-by[x].n);
  if(!names.length)return"";
  return '<div class="ptitle">How the meds worked</div>'+
    '<p class="pnote">From the Did it help? buttons on the Took something page. None means not rated yet, and is not counted as a failure.</p>'+
    '<div class="cmp tight" style="grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,.7fr))">'+
    '<div class="h"></div><div class="h">Yes</div><div class="h">Part</div><div class="h">No</div><div class="h">None</div>'+
    names.map(n=>{const o=by[n];return '<div class="r">'+esc(n)+"</div><div>"+o.yes+"</div><div>"+o.partly+"</div><div>"+o.no+"</div><div>"+o.none+"</div>"}).join("")+"</div>";
}

function patternsSheet(){
  const all=live("attacks").sort((x,y)=>x.startedAt-y.startedAt);
  const closed=all.filter(a=>a.endedAt&&a.endedAt>a.startedAt);
  if(all.length<3){
    openSheet('<div class="sheet-h"><h3>Patterns</h3><button class="lnk" id="x">Close</button></div>'+
      '<div class="empty"><b>Not enough attacks yet</b><span>Patterns appear once there are a few logged.</span></div>');
    document.getElementById("x").onclick=shut;return;
  }
  const lab24=Array.from({length:24},(_,h)=>h%3===0?String(h):"");
  const on=Array(24).fill(0),off=Array(24).fill(0);
  all.forEach(a=>on[new Date(a.startedAt).getHours()]++);
  closed.forEach(a=>off[new Date(a.endedAt).getHours()]++);
  const night=all.filter(a=>new Date(a.startedAt).getHours()<6).length;
  // typical start time: shift by 6h so a night spanning midnight doesn't split in two
  const medOn=median(all.map(a=>(hrs(a.startedAt)+6)%24));
  const endsBy12=closed.filter(a=>new Date(a.endedAt).getHours()<12&&dayKey(a.endedAt)===dayKey(a.startedAt)).length;
  const durs=closed.map(a=>hours(a));
  const B=[[0,1,"<1"],[1,2,"1-2"],[2,4,"2-4"],[4,6,"4-6"],[6,8,"6-8"],[8,12,"8-12"],[12,24,"12-24"],[24,1e9,"24+"]];
  const dc=B.map(b=>durs.filter(d=>d>=b[0]&&d<b[1]).length);
  const bed=getBed();
  let bedHtml="";
  if(bed){
    const bh=+bed.split(":")[0]+(+bed.split(":")[1])/60;
    const after=all.map(a=>((hrs(a.startedAt)-bh)%24+24)%24);
    const asleep=after.filter(h=>h>=1&&h<=10).length;
    const bc=Array(12).fill(0);after.forEach(h=>{if(h<12)bc[Math.floor(h)]++});
    bedHtml='<div class="ptitle">Hours after bedtime ('+esc(bed)+")</div>"+
      '<p class="pnote">Median start is '+median(after).toFixed(1)+"h after bedtime. "+asleep+" of "+all.length+" started 1 to 10 hours after it.</p>"+
      hist(bc,bc.map((_,i)=>i%2===0?String(i):""))+
      '<p class="pnote">Bedtime means when you usually fall asleep. A late night or shift work will blur this.</p>';
  }
  const cl=clusterList(all);
  const gaps=[];for(let i=1;i<cl.length;i++)gaps.push(cl[i].startN-cl[i-1].endN);
  const recent=cl.slice().reverse().slice(0,12);
  const dmyk=k=>{const p=k.split("-");return dmy(new Date(+p[0],+p[1]-1,+p[2]).getTime())};
  const md=median(cl.map(c=>c.days));
  const cell=(n,l)=>'<div class="stat" style="cursor:default"><div class="n">'+n+'</div><div class="l">'+l+"</div></div>";
  openSheet('<div class="sheet-h"><h3>Patterns</h3><button class="lnk" id="x">Close</button></div>'+
    '<p class="sheet-note">All '+all.length+' logged attacks. Descriptive only: it shows when and how they happen, it does not diagnose.</p>'+
    '<div class="stats" style="margin-bottom:4px">'+
      cell(clock(medOn-6),"typical start time")+
      cell(night+"/"+all.length,"started 00:00 to 06:00")+
      cell(durs.length?median(durs).toFixed(1)+"h":"-","median length")+
      cell(closed.length?endsBy12+"/"+closed.length:"-","over by midday, same day")+
    "</div>"+
    '<div class="ptitle">When they start</div><p class="pnote">Hour of day, 24h clock.</p>'+hist(on,lab24)+
    '<div class="ptitle">When they end</div>'+hist(off,lab24,true)+
    '<div class="ptitle">How long they last</div><p class="pnote">Hours.</p>'+hist(dc,B.map(b=>b[2]))+
    '<div class="field" style="margin-top:14px"><label for="bedt">Usual bedtime (optional)</label>'+
      '<input type="time" id="bedt" value="'+esc(bed)+'"></div>'+bedHtml+
    nightDayHtml(all)+medsWorkedHtml()+
    '<div class="ptitle">Clusters</div>'+
    '<p class="pnote">Attack days less than 4 days apart are grouped into one cluster. '+cl.length+" cluster"+(cl.length===1?"":"s")+
      (gaps.length?", median gap between them "+Math.round(median(gaps))+" days":"")+
      (cl.length?", median "+md+" attack day"+(md===1?"":"s")+" each":"")+".</p>"+
    '<div class="dl">'+recent.map((c,i)=>{
      const older=recent[i+1];
      return '<div class="dl-row"><div><div class="dl-n">'+(c.startK===c.endK?dmyk(c.startK):dmyk(c.startK)+" to "+dmyk(c.endK))+
        '</div><div class="dl-s">'+c.days+" day"+(c.days===1?"":"s")+" · "+c.attacks+" attack"+(c.attacks===1?"":"s")+"</div></div>"+
        (older?'<div class="dl-t"><small>'+(c.startN-older.endN)+" days after the previous</small></div>":"")+"</div>";
    }).join("")+"</div>");
  document.getElementById("x").onclick=shut;
  document.getElementById("bedt").onchange=e=>{setBed(e.target.value);patternsSheet()};
}

/* ---------- toast ---------- */
function toast(msg,undo){
  const t=document.getElementById("toast"),b=document.getElementById("toastBtn");
  document.getElementById("toastTxt").textContent=msg;t.hidden=false;
  undoFn=undo||null;b.hidden=!undo;
  clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;undoFn=null},6000);
}
document.getElementById("toastBtn").onclick=()=>{if(undoFn)undoFn();document.getElementById("toast").hidden=true;undoFn=null};

/* ---------- actions ---------- */
function startAttack(){
  const a=put("attacks",{id:uid(),startedAt:Date.now(),endedAt:null,scored:false});
  emit({event:"attack start",at:a.startedAt,attackId:a.id},a.id);
  toast("Attack logged at "+hhmm(a.startedAt),()=>drop("attacks",a.id));
}

const sheet=document.getElementById("sheet");
function openSheet(html){sheet.innerHTML=html;sheet.hidden=false;document.body.style.overflow="hidden";sheet.scrollTop=0}
function shut(){if(medTick){clearInterval(medTick);medTick=null}sheet.hidden=true;sheet.innerHTML="";document.body.style.overflow=""}
function chipRow(name,items,multi){
  return '<div class="chips" data-chips="'+name+'" data-multi="'+(multi?1:0)+'">'+
    items.map(i=>'<button type="button" class="chip" aria-pressed="false" data-v="'+esc(i)+'">'+esc(i)+"</button>").join("")+"</div>";
}
sheet.addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;

// minimum gap between doses, in hours. Only drugs listed here get a countdown;
// the rest just show time since taken. Add entries as you learn the gaps.
const GAP_H={"Paracetamol":4,"Sumatriptan":2,"Naratriptan":2};
let medTick=null;
const OUT=[["yes","Helped"],["partly","Partly"],["no","No"]];
const OUTWORD={yes:"helped",partly:"partly helped",no:"no help"};
function doseLabel(d){return hhmm(d.at)+" "+d.drug+(d.helped?" ("+OUTWORD[d.helped]+")":"")}
function setOutcome(id,k){
  const d=S.doses[id];if(!d||d.helped===k)return;
  d.helped=k;put("doses",d);
  emit({event:"dose outcome",at:Date.now(),drug:d.drug,drugClass:CLASS[d.drug]||"",started:d.at,attackId:d.attackId||"",note:k},null);
  medRefresh();
}
function hms(ms){
  ms=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),x=ms%60;
  return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");
}
function medClockHtml(){
  const d=new Date();
  return hhmm(d.getTime())+":"+String(d.getSeconds()).padStart(2,"0")+"<small>"+dmy(d.getTime())+"</small>";
}
function timerCell(d,now){
  const el=now-d.at,gap=GAP_H[d.drug];
  if(gap){
    const left=gap*3600e3-el;
    return left>0
      ?{cls:"wait",html:hms(left)+"<small>until next OK · "+hhmm(d.at+gap*3600e3)+"</small>"}
      :{cls:"ok",html:"OK to take<small>"+hms(el)+" since taken</small>"};
  }
  return{cls:"",html:hms(el)+"<small>since taken</small>"};
}
function medDoses(){const now=Date.now();return live("doses").filter(d=>now-d.at<24*3600e3).sort((x,y)=>y.at-x.at)}
function medListHtml(ds){
  const now=Date.now();
  if(!ds.length)return '<div class="dl-empty">Nothing taken in the last 24 hours.</div>';
  return ds.map(d=>{
    const t=timerCell(d,now);
    return '<div class="dl-row"><div><div class="dl-n">'+esc(d.drug)+'</div><div class="dl-s">taken '+hhmm(d.at)+"</div>"+
      '<div class="oc"><span>Did it help?</span>'+OUT.map(o=>'<button type="button" class="ob'+(d.helped===o[0]?" on":"")+'" data-o="'+o[0]+'" data-id="'+d.id+'">'+o[1]+"</button>").join("")+"</div></div>"+
      '<div class="dl-t '+t.cls+'" data-tm="'+d.id+'">'+t.html+"</div></div>";
  }).join("");
}
function medRefresh(){
  const c=document.getElementById("medClock"),l=document.getElementById("medList");
  if(!c||!l){clearInterval(medTick);medTick=null;return}
  c.innerHTML=medClockHtml();
  const ds=medDoses(),sig=ds.map(d=>d.id+(d.helped||"")).join("|");
  if(l.dataset.sig!==sig){l.innerHTML=medListHtml(ds);l.dataset.sig=sig;return}
  // same doses: only the timers move, so buttons never get rebuilt under a finger
  const now=Date.now();
  ds.forEach(d=>{const el=l.querySelector('[data-tm="'+d.id+'"]');if(!el)return;const t=timerCell(d,now);el.className="dl-t "+t.cls;el.innerHTML=t.html});
}

function toLocal(ms){const d=new Date(ms-d0(ms));return d.toISOString().slice(0,16)}
function d0(ms){return new Date(ms).getTimezoneOffset()*6e4}
function fromLocal(v){return v?new Date(v).getTime():null}
function scoreFields(a){
  return '<div class="field"><label>When it ran</label><div class="row3" style="grid-template-columns:1fr 1fr">'+
      '<div><label for="t0">Started</label><input type="datetime-local" id="t0" value="'+toLocal(a.startedAt)+'"></div>'+
      '<div><label for="t1">Ended</label><input type="datetime-local" id="t1" value="'+toLocal(a.endedAt||Date.now())+'"></div>'+
    "</div></div>"+
    '<div class="field"><label>Where</label>'+chipRow("side",SIDES,true)+"</div>"+

    '<div class="field"><label>Aura</label>'+chipRow("aura",["Visual disturbance"],true)+"</div>"+
    '<div class="field"><label>Watery eye or blocked nose</label>'+chipRow("auto",AUTO.map(x=>x[1]),true)+
      '<div style="margin-top:7px">'+chipRow("autoside",["Same side as pain","Both sides"],false)+"</div></div>"+
    '<div class="field"><label>Notes</label><textarea id="nt" placeholder="optional">'+esc(a.note||"")+"</textarea></div>";
}
function saveScore(a){
  const sym={};SYMPTOMS.forEach(([k,l])=>{sym[k]=picked("sym").includes(l)});
  const au={};AUTO.forEach(([k,l])=>{au[k]=picked("auto").includes(l)});
  a.type=a.type||""; // no longer asked: the app works the type out from the answers
  a.side=picked("side");
  a.symptoms=sym;
  a.aura=picked("aura").length>0;
  a.autonomic=au;a.autonomicSide=one("autoside");
  a.note=document.getElementById("nt").value.trim();
  a.scored=true;
  const t0=fromLocal(document.getElementById("t0").value),t1=fromLocal(document.getElementById("t1").value);
  if(t0)a.startedAt=t0;
  a.endedAt=t1||a.endedAt||Date.now();
  if(a.endedAt<a.startedAt){toast("End time is before the start");return}
  put("attacks",a);
  const v=score(a);
  emit({event:"attack end",at:Date.now(),attackId:a.id,started:a.startedAt,ended:a.endedAt,
    type:a.type,side:(a.side||[]).join(" / "),aura:!!a.aura,
    throbbing:!!sym.throbbing,oneSided:!!sym.oneSided,nausea:!!sym.nausea,lightSound:!!sym.lightSound,
    stopped:!!sym.stopped,worseMove:!!sym.worseMove,eye:!!au.eye,nose:!!au.nose,
    autonomicSide:a.autonomicSide||"",note:a.note||""},a.id);
  shut();toast("Saved · "+v.verdict+" (ID "+v.id+", POUND "+v.pound+")");
}

// doses and BP readings that belong to an attack: linked by id, or inside the
// window from 1h before it started to when it ended (or now, if still running)
function attackExtras(a){
  const from=a.startedAt-36e5,to=a.endedAt||Date.now();
  const inWin=x=>x.at>=from&&x.at<=to;
  const doses=live("doses").filter(d=>d.attackId===a.id||inWin(d)).sort((x,y)=>x.at-y.at);
  const bp=live("readings").filter(inWin).sort((x,y)=>x.at-y.at);
  return{doses:doses,bp:bp};
}

function csv(rows){return rows.map(r=>r.map(c=>{const s=String(c==null?"":c);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(",")).join("\n")}
function saveFile(name,text,mime){
  const b=new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"});
  const u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500);
}
function buildFiles(){
  const aRows=[["Started","Ended","Hours","Type","Side","Aura","Throbbing","One-sided","Nausea","Light/Sound","Stopped","Worse on movement","Watery eye","Blocked nose","Autonomic side","ID Migraine","POUND","Verdict","Notes"]];
  live("attacks").sort((x,y)=>x.startedAt-y.startedAt).forEach(a=>{const v=score(a),s=a.symptoms||{},au=a.autonomic||{};
    aRows.push([dayKey(a.startedAt)+" "+hhmm(a.startedAt),a.endedAt?dayKey(a.endedAt)+" "+hhmm(a.endedAt):"",
      a.endedAt?(hours(a)||0).toFixed(1):"",a.type||"",(a.side||[]).join(" / "),a.aura?"Y":"N",
      s.throbbing?"Y":"N",s.oneSided?"Y":"N",s.nausea?"Y":"N",s.lightSound?"Y":"N",s.stopped?"Y":"N",s.worseMove?"Y":"N",
      au.eye?"Y":"N",au.nose?"Y":"N",a.autonomicSide||"",v.id==null?"":v.id,v.pound==null?"":v.pound,v.verdict,a.note||""]);});
  const rRows=[["Date","Time","Systolic","Diastolic","Pulse","Dizzy on standing","Note"]];
  live("readings").sort((x,y)=>x.at-y.at).forEach(r=>rRows.push([dayKey(r.at),hhmm(r.at),r.sys,r.dia,r.pulse||"",r.orthostatic?"Y":"N",r.note||""]));
  const dRows=[["Date","Time","Drug","Class","Helped"]];
  live("doses").sort((x,y)=>x.at-y.at).forEach(d=>dRows.push([dayKey(d.at),hhmm(d.at),d.drug,CLASS[d.drug]||"",d.helped||""]));
  const sRows=[["Date","Time","Signs","Note"]];
  live("signals").sort((x,y)=>x.at-y.at).forEach(s=>sRows.push([dayKey(s.at),hhmm(s.at),(s.kinds||[]).join(" / "),s.note||""]));
  return[["attacks.csv",csv(aRows),"text/csv"],["bp-readings.csv",csv(rRows),"text/csv"],
    ["doses.csv",csv(dRows),"text/csv"],["warning-signs.csv",csv(sRows),"text/csv"],
    ["attack-log-backup.json",JSON.stringify({records:S,outbox:outbox},null,1),"application/json"]];
}

    b.hidden=false;document.getElementById("tbl").textContent="Hide the numbers";
  };
  wireReadout(rs,t0,t1);
}
function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+"</div></div>"}

function plot(rs,t0,t1,atk,kind){
  const isBp=kind==="bp";
  const H=isBp?200:112, h=H-PAD.t-PAD.b, w=VW-PAD.l-PAD.r;
  const vals=isBp?rs.map(r=>r.dia).concat(rs.map(r=>r.sys)):rs.filter(r=>r.pulse).map(r=>r.pulse);
  if(!vals.length)return"";
  let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(isBp){lo=Math.min(60,Math.floor(lo/10)*10);hi=Math.max(150,Math.ceil(hi/10)*10)}
  else{lo=Math.floor((lo-4)/10)*10;hi=Math.ceil((hi+4)/10)*10}
  const step=isBp?20:20;
  let g="",ticks="";
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){
    const y=sy(v,lo,hi,PAD.t,h);
    g+='<line x1="'+PAD.l+'" x2="'+(VW-PAD.r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
    ticks+='<text x="'+(PAD.l-5)+'" y="'+(y+3)+'" font-size="9" text-anchor="end">'+v+"</text>";
  }
  // day bands for attacks
  let bands="";
  const seen={};
  atk.forEach(a=>{const k=dayKey(a.startedAt);if(seen[k])return;seen[k]=1;
    const d=new Date(a.startedAt);d.setHours(0,0,0,0);
    const s=Math.max(d.getTime(),t0), e=Math.min(d.getTime()+DAY,t1);
    if(e<=s)return;
    bands+='<rect x="'+sx(s,t0,t1,w)+'" y="'+PAD.t+'" width="'+Math.max(1,sx(e,t0,t1,w)-sx(s,t0,t1,w))+
      '" height="'+h+'" fill="#d2664a" opacity="0.13"/>';});
  // x labels every 7 days
  let xl="";
  for(let i=0;i<=4;i++){const t=t0+(t1-t0)*i/4;
    xl+='<text x="'+sx(t,t0,t1,w)+'" y="'+(H-5)+'" font-size="9" text-anchor="'+(i===0?"start":i===4?"end":"middle")+'">'+dmy(t)+"</text>";}
  let refs="";
  if(isBp){[135,85].forEach(v=>{const y=sy(v,lo,hi,PAD.t,h);
    refs+='<line x1="'+PAD.l+'" x2="'+(VW-PAD.r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--ref)" stroke-width="1" stroke-dasharray="3 3"/>';});}
  function series(key,col){
    const pts=rs.filter(r=>r[key]).map(r=>[sx(r.at,t0,t1,w),sy(r[key],lo,hi,PAD.t,h),r]);
    if(!pts.length)return"";
    const line='<polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+
      pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'"/>';
    const dots=pts.map(p=>{const morning=new Date(p[2].at).getHours()<12;
      return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="'+(morning?col:"var(--surface)")+
        '" stroke="'+col+'" stroke-width="1.5"/>';}).join("");
    return line+dots;
  }
  const body=isBp
    ? series("sys","var(--sys)")+series("dia","var(--dia)")
    : series("pulse","var(--dim)");
  return '<svg class="chart" viewBox="0 0 '+VW+" "+H+'" role="img" aria-label="'+
    (isBp?"Blood pressure over the last 30 days":"Pulse over the last 30 days")+'"'+
    (isBp?' id="bpSvg"':"")+'>'+bands+g+refs+
    '<line x1="'+PAD.l+'" x2="'+(VW-PAD.r)+'" y1="'+(PAD.t+h)+'" y2="'+(PAD.t+h)+'" stroke="var(--line)" stroke-width="1"/>'+
    ticks+xl+body+'<line id="cross" x1="0" x2="0" y1="'+PAD.t+'" y2="'+(PAD.t+h)+'" stroke="var(--dim-2)" stroke-width="1" opacity="0"/></svg>';
}

function wireReadout(rs,t0,t1){
  const svg=document.getElementById("bpSvg"), ro=document.getElementById("ro");
  if(!svg)return;
  const w=VW-PAD.l-PAD.r;
  function at(ev){
    const b=svg.getBoundingClientRect();
    const x=((ev.touches?ev.touches[0].clientX:ev.clientX)-b.left)/b.width*VW;
    const t=t0+(x-PAD.l)/w*(t1-t0);
    let best=null,bd=Infinity;
    rs.forEach(r=>{const d=Math.abs(r.at-t);if(d<bd){bd=d;best=r}});
    if(!best)return;
    ro.textContent=dmy(best.at)+" "+hhmm(best.at)+"  ·  "+best.sys+"/"+best.dia+(best.pulse?"  ·  "+best.pulse+" bpm":"");
    const c=svg.querySelector("#cross");
    c.setAttribute("x1",sx(best.at,t0,t1,w));c.setAttribute("x2",sx(best.at,t0,t1,w));c.setAttribute("opacity","0.5");
  }
  svg.addEventListener("pointerdown",at);
  svg.addEventListener("pointermove",e=>{if(e.pressure>0||e.buttons||e.pointerType==="mouse")at(e)});
}
